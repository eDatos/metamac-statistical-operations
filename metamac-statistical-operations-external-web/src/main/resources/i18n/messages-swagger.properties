api.doc.swagger.definitions.instance.properties.completeness = Descripción de la medida en que todos los datos que se necesitan son aportados por la instancia estadística. Proporciona información sobre la exhaustividad en comparación con los reglamentos y directrices pertinentes
api.doc.swagger.definitions.instance.properties.dataCompilation = Descripción del proceso de recolección y tratamiento de datos (por ejemplo: método de muestreo, validación e imputación, tratamieto de la falta de respuesta, ponderación y calibración, uso de modelos, etc.)
api.doc.swagger.definitions.instance.properties.dataDescription = Describe, de una manera fácilmente comprensible, los principales datos e indicadores difundidos. Esta breve descripción debe ser entendida inmediatamente y fácilmente por los usuarios
