api.doc.swagger.definitions.instance.properties.temporalComparability = Descripción del grado en que las estadísticas son comparables o pueden conciliarse a lo largo del tiempo. Información sobre la longitud de las series comparables, los períodos de referencia en los que se producen roturas de la serie, las razones de las pausas y los tratamientos asociados
