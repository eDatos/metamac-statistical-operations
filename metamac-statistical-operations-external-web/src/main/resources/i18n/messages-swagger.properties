api.doc.swagger.title = API de operaciones estadísticas v1.0
api.doc.swagger.description = Las operaciones estadísticas son la unidad básica de planificación de la actividad estadística. Todos los recursos que se publican guardan relación de manera directa o indirecta con alguna operación. Esta API permite consultar el inventario de operaciones estadísticas, las diferencias que existen entre las diferentes realizaciones de una misma operación estadística (instancias) y su agrupación en familias. Asi, por ejemplo, tenemos que el \\"Censo de Población y Viviendas\\" es una operación estadística de la que podremos encontrar distintas realizaciones o instancias (Censo 2011, Censo 2001, Censo 1991, etc.) y que podría agruparse con otras operaciones dentro de una famlia \\"Estadísticas poblacionales\\". Los datos de las operaciones estadísticas y de sus instancias están armonizados con la propuesta de Eurostat para el Sistema Estadístico Europeo y definida en el documento EURO-SDMX Metadata Structure (release 4, December 2014)
api.doc.swagger.tag.families = Familias de operaciones
api.doc.swagger.tag.operations = Operaciones estadísticas
api.doc.swagger.tag.auxiliaryValueTables = Tablas de valores auxiliares

