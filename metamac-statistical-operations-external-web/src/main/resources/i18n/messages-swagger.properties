api.doc.swagger.definitions.updateFrequencies                                       = Frecuencias de acualizaci\u00F3n de los datos
api.doc.swagger.description                                                         = Las operaciones estad\u00EDsticas son la unidad b\u00E1sica de planificaci\u00F3n de la actividad estad\u00EDstica. Todos los recursos que se publican guardan relaci\u00F3n de manera directa o indirecta con alguna operaci\u00F3n. Esta API permite consultar el inventario de operaciones estad\u00EDsticas, las diferencias que existen entre las diferentes realizaciones de una misma operaci\u00F3n estad\u00EDstica (instancias) y su agrupaci\u00F3n en familias. Asi, por ejemplo, tenemos que el \\"Censo de Poblaci\u00F3n y Viviendas\\" es una operaci\u00F3n estad\u00EDstica de la que podremos encontrar distintas realizaciones o instancias (Censo 2011, Censo 2001, Censo 1991, etc.) y que podr\u00EDa agruparse con otras operaciones dentro de una famlia \\"Estad\u00EDsticas poblacionales\\". Los datos de las operaciones estad\u00EDsticas y de sus instancias est\u00E1n armonizados con la propuesta de Eurostat para el Sistema Estad\u00EDstico Europeo y definida en el documento EURO-SDMX Metadata Structure (release 4, December 2014)
api.doc.swagger.paths.collMethods.get                                               = Permite obtener todos los m\u00E9todos de recolecci\u00F3n de datos existentes
api.doc.swagger.paths.costs.get                                                     = Permite obtener el listado de todos los tipos de costes disponibles para las operaciones estad\u00EDsticas
api.doc.swagger.paths.families.get                                                  = Permite obtener el listado de familias de operaciones estad\u00EDsticas
api.doc.swagger.paths.families.get.parameters.query                                 = Permite realizar una b\u00FAsqueda sobre los resultados. <br/>\r\n Los metadatos sobre los que se puede buscar son: ID, URN, TITLE, ACRONYM, DESCRIPTION e INVENTORY_DATE.<br/>\r\n Los operadores l\u00F3gicos que se permite usar son: AND y OR.  <br/>\r\n Los operadores de comparaci\u00F3n que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN.  <br/>\\r\\n Ejemplos: <br/>\\r\\n- ID LIKE \\"E303\\" <br/>\\r\\n- (ID LIKE \\"Family1\\" AND ACRONYM EQ \\"Family1\\") OR (DESCRIPTION IS_NOT_NULL)
api.doc.swagger.paths.families.id.get                                               = Permite obtener una familia en particular
api.doc.swagger.paths.families.id.get.parameters.id                                 = Identificador de la familia
api.doc.swagger.paths.families.id.operations.get                                    = Permite obtener todas las operaciones que forman parte de una determinada familia
api.doc.swagger.paths.families.id.operations.get.parameters.id                      = Identificador de la familia estad\u00EDstica
api.doc.swagger.paths.families_operations.get.parameters.limit                      = N\u00FAmero m\u00E1ximo de resultados a obtener
api.doc.swagger.paths.families_operations.get.parameters.offset                     = Desplazamiento. N\u00FAmero a partir del cual se comienzan a obtener los resultados
api.doc.swagger.paths.families_operations.get.parameters.orderBy                    = Permite ordenar la lista de resultados seg\u00FAn un determinado metadato. El orden se especifica mediante un metadato y el sentido del orden (operador) que se le quiere aplicar.<br/>\\r\\n Los posibles operadores son ASC y DESC.<br/>\\r\\n El metadato que se puede usar es ID. <br/>\r\n Ejemplos:<br/>\\r\\n- ID ASC<br/>\\r\\n- ID DESC
api.doc.swagger.paths.instanceTypes.get                                             = Permite obtener todos los tipos de instancias de operaciones que existen
api.doc.swagger.paths.officialityTypes.get                                          = Permite obtener todos los tipos de oficialidad que se le pueden asignar a las diferentes operaciones estad\u00EDsticas
api.doc.swagger.paths.operations.get                                                = Permite obtener el listado de operaciones estad\u00EDsticas existentes en el inventario
api.doc.swagger.paths.operations.id.families.get                                    = Permite obtener el listado de familias estad\u00EDsticas en las que se engloba una operaci\u00F3n en concreto
api.doc.swagger.paths.operations.id.get                                             = Permite obtener una operaci\u00F3n estad\u00EDstica en concreto
api.doc.swagger.paths.operations.operationId.instances.get                          = Permite obtener el listado de instancias relacionadas con una operaci\u00F3n estad\u00EDstica en concreto
api.doc.swagger.paths.operations.operationId.instances.get.parameters.fields        = Permite personalizar la respuesta mediante la exclusi\u00F3n o inclusi\u00F3n de campos de la misma. Los posibles valores son '+subjectArea', '+diffusionAndPublicationVisible' y '+description'.<br/>Ejemplos: <br/>\\r\\n- fields=+subjectArea,+diffusionAndPublicationVisible,+description<br/>
api.doc.swagger.paths.operations.operationId.get.instance.parameters.fields         = Permite personalizar la respuesta mediante la exclusi\u00F3n o inclusi\u00F3n de campos de la misma. Los posibles valores son '+description'.<br/>Ejemplos: <br/>\\r\\n- fields=+description<br/>
api.doc.swagger.paths.operations.operationId.instances.get.parameters.query         = Permite realizar una b\u00FAsqueda sobre los resultados. <br/>\r\n Los metadatos sobre los que se puede buscar son: ID, URN, TITLE, ACRONYM, DATA_DESCRIPTION, GEOGRAPHIC_GRANULARITY_URN, TEMPORAL_GRANULARITY_URN, DIFFUSION_PUBLICATION_VISIBLE e INVENTORY_DATE.<br/>\r\n Los operadores l\u00F3gicos que se permite usar son: AND y OR.  <br/>\r\n Los operadores de comparaci\u00F3n que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN.  <br/>\\r\\n Ejemplos: <br/>\\r\\n- ID LIKE \\"E303\\" <br/>\\r\\n- (ID LIKE \\"Instance1\\" AND DATA_DESCRIPTION EQ \\"DataDescription1\\") OR (ACRONYM EQ \\"Instance1\\")
api.doc.swagger.paths.operations.operationId.instances.id.get                       = Permite obtener una instancia en particular de una operaci\u00F3n estad\u00EDstica
api.doc.swagger.paths.operations.operationId.instances.id.get.parameters.id         = Identificador de la instancia
api.doc.swagger.paths.operationsIdParam.idDescription                               = Identificador de la operaci\u00F3n estad\u00EDstica
api.doc.swagger.paths.operationsQueryParam.queryDescription                         = Permite realizar una b\u00FAsqueda sobre los resultados. <br/>\\r\\n Los metadatos sobre los que se puede buscar son: ID, URN, TITLE, ACRONYM, SUBJECT_AREA_URN, SECONDARY_SUBJECT_AREA_URN, DESCRIPTION, STATISTICAL_OPERATION_TYPE_ID, OFFICIALITY_TYPE_ID, IS_INDICATORS_SYSTEM, PRODUCER_URN, CURRENTLY_ACTIVE, STATUS, PUBLISHER_URN e INVENTORY_DATE.<br/>\\r\\n Los operadores l\u00F3gicos que se permite usar son: AND y OR. <br/>\\r\\n Los operadores de comparaci\u00F3n que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN. <br/>\\r\\n Ejemplos:<br/>\\r\\n- ID LIKE \\"E303\\"<br/>\\r\\n- (ID LIKE \\"E303\\" AND CONTACT_URN LIKE \\"urn:contact:1\\") OR (CONTACT_URN EQ \\"urn:contact:2\\")
api.doc.swagger.paths.responses.200                                                 = \u00C9xito. Indica que la petici\u00F3n ha sido resuelta correctamente
api.doc.swagger.paths.responses.406                                                 = No aceptable. El formato solicitado no es v\u00E1lido
api.doc.swagger.paths.responses.500                                                 = Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado
api.doc.swagger.paths.responses.503                                                 = Servicio no disponible. Indica que actualmente el servidor no est\u00E1 disponible y, por tanto, la solicitud no puede procesarse. El error puede deberse a una sobrecarga temporal o a labores de mantenimiento del servidor. Se trata de una situaci\u00F3n temporal
