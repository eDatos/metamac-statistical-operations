api.doc.swagger.paths.responses.500 = Error interno del servidor. Se ha producido un error que impide que se obtenga el recurso solicitado
api.doc.swagger.paths.responses.503 = Servicio no disponible. Indica que actualmente el servidor no está disponible y, por tanto, la solicitud no puede procesarse. El error puede deberse a una sobrecarga temporal o a labores de mantenimiento del servidor. Se trata de una situación temporal

api.doc.swagger.definitions.instance.properties.classSystems = Identificación de las clasificaciones utilizadas en la instancia de la operación. Las clasificaciones identificadas se vinculan con las distribuidas en la API de recursos estructurales de e-Semántica
api.doc.swagger.definitions.instance.properties.statConcDefs = Identificación de los conceptos utilizados en la instancia de la operación. Los conceptos identificados se vinculan con los distribuidos en la API de recursos estructurales de e-Semántica
api.doc.swagger.definitions.listBase.properties.selfLinkExtra = Enlace al propio recurso. Dado un resultado, nos permite saber cómo realizar la petición a la API para volver a obtenerlo
api.doc.swagger.definitions.instance.properties.seasonalAdjustment = La técnica estadística utilizada para eliminar los efectos del calendario estacional en una serie
api.doc.swagger.definitions.instance.properties.coherInternal.coherNationalAccounts = Descripción del grado en que las estadísticas son conciliables con las cuentas nacionales
api.doc.swagger.definitions.instance.properties.coherInternal.coherSubanualAnual = Descripción del grado en que las estadísticas de diferentes frecuencias son conciliables
api.doc.swagger.definitions.instance.properties.coverageError = Descripción de la divergencia entre la población marco y la población objetivo
api.doc.swagger.definitions.instance.properties.inventoryDate.measurementError = Los errores de medida son errores que se producen durante la recolección de datos en los que los valores registrados son diferentes de los reales
api.doc.swagger.definitions.instance.properties.modelError = Error debido a modelos específicos de dominio necesarios para definir el objetivo de la estimación
api.doc.swagger.definitions.instance.properties.nonResponseError = Los errores de sin respuesta se producen cuando la encuesta no obtiene una respuesta a una, o posiblemente todas, las preguntas
api.doc.swagger.definitions.instance.properties.processingError = El error en el proceso final de recolección de datos debido a la incorrecta aplicación de métodos de implementación correctamente planificados
api.doc.swagger.paths.operations.operationId.instances.get.parameters.fields = Permite personalizar la respuesta mediante la exclusión o inclusión de campos de la misma. Los posibles valores son '+subjectArea'.<br/>Ejemplos: <br/>\r\n- fields=+subjectArea<br/>