api.doc.swagger.definitions.operation.properties.legalActs = Indica que la actividad estadística está cubierta por un acto jurídico o por algún acuerdo formal. Se relacionan los actos jurídicos o acuerdos que asignen responsabilidad o autoridad de una agencia para la recolección, procesamiento y difusión de datos de la operación estadística
