api.doc.swagger.paths.families_operations.get.parameters.limit = Número máximo de resultados a obtener
api.doc.swagger.paths.families_operations.get.parameters.offset = Desplazamiento. Número a partir del cual se comienzan a obtener los resultados
api.doc.swagger.paths.families_operations.get.parameters.orderBy = Permite ordenar la lista de resultados según un determinado metadato. El orden se especifica mediante un metadato y el sentido del orden (operador) que se le quiere aplicar.<br/>\r\n Los posibles operadores son ASC y DESC.<br/>\r\n El metadato que se puede usar es ID. <br/>Ejemplos:<br/>\r\n- ID ASC<br/>\r\n- ID DESC
api.doc.swagger.paths.operationsQueryParam.queryDescription = Permite realizar una búsqueda sobre los resultados. <br/>\r\n Los metadatos sobre los que se puede buscar son: ID, URN, TITLE, ACRONYM, SUBJECT_AREA_URN, SECONDARY_SUBJECT_AREA_URN, DESCRIPTION, STATISTICAL_OPERATION_TYPE_ID, OFFICIALITY_TYPE_ID, IS_INDICATORS_SYSTEM, PRODUCER_URN, CURRENTLY_ACTIVE, STATUS, PUBLISHER_URN e INVENTORY_DATE.<br/>\r\n Los operadores lógicos que se permite usar son: AND y OR.  <br/>\r\n Los operadores de comparación que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN.  <br/>\r\n Ejemplos: <br/>\r\n- ID LIKE \\"E303\\" <br/>\r\n- (ID LIKE \\"E303\\" AND CONTACT_URN LIKE \\"urn:contact:1\\") OR (CONTACT_URN EQ \\"urn:contact:2\\")
api.doc.swagger.paths.operations.operationId.instances.get.parameters.query = Permite realizar una búsqueda sobre los resultados. <br/>\r\n Los metadatos sobre los que se puede buscar son: ID, URN, TITLE, ACRONYM, DATA_DESCRIPTION, GEOGRAPHIC_GRANULARITY_URN, TEMPORAL_GRANULARITY_URN e INVENTORY_DATE.<br/>\r\n Los operadores lógicos que se permite usar son: AND y OR.  <br/>\r\n Los operadores de comparación que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN.  <br/>\r\n Ejemplos: <br/>\r\n- ID LIKE \\"E303\\" <br/>\r\n- (ID LIKE \\"Instance1\\" AND DATA_DESCRIPTION EQ \\"DataDescription1\\") OR (ACRONYM EQ \\"Instance1\\")
api.doc.swagger.paths.families.get.parameters.query = Permite realizar una búsqueda sobre los resultados. <br/>\r\n Los metadatos sobre los que se puede buscar son: ID, URN, TITLE, ACRONYM, DESCRIPTION e INVENTORY_DATE.<br/>\r\n Los operadores lógicos que se permite usar son: AND y OR.  <br/>\r\n Los operadores de comparación que se permite usar son: EQ, IEQ, LIKE, ILIKE, NE, LT, LE, GT, GE, IS_NULL, IS_NOT_NULL e IN.  <br/>\r\n Ejemplos: <br/>\r\n- ID LIKE \\"E303\\" <br/>\r\n- (ID LIKE \\"Family1\\" AND ACRONYM EQ \\"Family1\\") OR (DESCRIPTION IS_NOT_NULL)
