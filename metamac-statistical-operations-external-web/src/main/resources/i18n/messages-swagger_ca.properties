api.doc.swagger.description = Les operacions estadístiques són la unitat bàsica de planificació de l'activitat estadística. Tots els recursos que es publiquen guarden relació de manera directa o indirecta amb alguna operació. Aquesta API permet consultar l'inventari d'operacions estadístiques, les diferències que existeixen entre les diferents realitzacions d'una mateixa operació estadística (instàncies) i la seva agrupació en famílies. Asi, per exemple, tenim que el \\"Cens de Població i Habitatges\\" és una operació estadística de la qual podrem trobar diferents realitzacions o instàncies (Cens 2011, Cens 2001, Cens 1991, etc.) i que podria agrupar-se amb altres operacions dins d'una famlia \\"Estadístiques poblacionals\\". Les dades de les operacions estadístiques i de les seves instàncies estan harmonitzats amb la proposta d'Eurostat per al Sistema Estadístic Europeu i definida en el document EURO-SDMX Metadata Structure (release 4, December 2014)

