api.doc.swagger.definitions.updateFrequencies                                       = Freq\u00FC\u00E8ncies d'actualitzaci\u00F3 de les dades
api.doc.swagger.description                                                         = Les operacions estad\u00EDstiques s\u00F3n la unitat b\u00E0sica de planificaci\u00F3 de l'activitat estad\u00EDstica. Tots els recursos que es publiquen guarden relaci\u00F3 de manera directa o indirecta amb alguna operaci\u00F3. Aquesta API permet consultar l'inventari d'operacions estad\u00EDstiques, les difer\u00E8ncies que existeixen entre les diferents realitzacions d'una mateixa operaci\u00F3 estad\u00EDstica (inst\u00E0ncies) i la seva agrupaci\u00F3 en fam\u00EDlies. Asi, per exemple, tenim que el \\"Cens de Poblaci\u00F3 i Habitatges\\" \u00E9s una operaci\u00F3 estad\u00EDstica de la qual podrem trobar diferents realitzacions o inst\u00E0ncies (Cens 2011, Cens 2001, Cens 1991, etc.) i que podria agrupar-se amb altres operacions dins d'una famlia \\"Estad\u00EDstiques poblacionals\\". Les dades de les operacions estad\u00EDstiques i de les seves inst\u00E0ncies estan harmonitzats amb la proposta d'Eurostat per al Sistema Estad\u00EDstic Europeu i definida en el document EURO-SDMX Metadata Structure (release 4, December 2014)
api.doc.swagger.paths.collMethods.get                                               = Permet obtenir tots els m\u00E8todes de recol\u00B7lecci\u00F3 de dades existents
api.doc.swagger.paths.costs.get                                                     = Permet obtenir el llistat de tots els tipus de costos disponibles per a les operacions estad\u00EDstiques
api.doc.swagger.paths.families.get                                                  = Permet obtenir el llistat de fam\u00EDlies d'operacions estad\u00EDstiques
api.doc.swagger.paths.families.get.parameters.query                                 = Permet realitzar una cerca sobre els resultats. <br/>\r\n Les metadades sobre els quals es pot buscar s\u00F3n: ID, URN, TITLE, ACRONYM, DESCRIPTION e INVENTORY_DATE.<br/>\r\n Els operadors l\u00F2gics que es permet usar s\u00F3n: AND i OR. <br/>\r\n Els operadors de comparaci\u00F3 que es permet usar s\u00F3n: EQ, IEQ, LIKE, ILIKE, NE, LT, LI, GT, GE, IS_NULL, IS_NOT_NULL i IN. <br/>\\r\\n Exemples: <br/>\\r\\n- ID LIKE \\"E303\\" <br/>\\r\\n- (ID LIKE \\"Family1\\" AND ACRONYM EQ \\"Family1\\") OR (DESCRIPTION IS_NOT_NULL)
api.doc.swagger.paths.families.id.get                                               = Permet obtenir una fam\u00EDlia en particular
api.doc.swagger.paths.families.id.get.parameters.id                                 = Identificador de la fam\u00EDlia
api.doc.swagger.paths.families.id.operations.get                                    = Permet obtenir totes les operacions que formen part d'una determinada fam\u00EDlia
api.doc.swagger.paths.families.id.operations.get.parameters.id                      = Identificador de la fam\u00EDlia estad\u00EDstica
api.doc.swagger.paths.families_operations.get.parameters.limit                      = Nombre m\u00E0xim de resultats a obtenir
api.doc.swagger.paths.families_operations.get.parameters.offset                     = Despla\u00E7ament. N\u00FAmero a partir del qual es comencen a obtenir els resultats
api.doc.swagger.paths.families_operations.get.parameters.orderBy                    = Permet ordenar la llista de resultats segons una determinada metadada. L'ordre s'especifica mitjan\u00E7ant una metadada i el sentit de l'ordre (operador) que se li vol aplicar.<br/>\\r\\n Els possibles operadors s\u00F3n ASC i DESC.<br/>\\r\\n La metadada que es pot usar \u00E9s ID. <br/>\r\n Exemples:<br/>\\r\\n- ID ASC<br/>\\r\\n- ID DESC
api.doc.swagger.paths.instanceTypes.get                                             = Permet obtenir tots els tipus d'inst\u00E0ncies d'operacions que existeixen
api.doc.swagger.paths.officialityTypes.get                                          = Permet obtenir tots els tipus d'oficialitat que se li poden assignar a les diferents operacions estad\u00EDstiques
api.doc.swagger.paths.operations.get                                                = Permet obtenir el llistat d'operacions estad\u00EDstiques existents en l'inventari
api.doc.swagger.paths.operations.id.families.get                                    = Permet obtenir el llistat de fam\u00EDlies estad\u00EDstiques en les quals s'engloba una operaci\u00F3 en concret
api.doc.swagger.paths.operations.id.get                                             = Permet obtenir una operaci\u00F3 estad\u00EDstica en concret
api.doc.swagger.paths.operations.operationId.instances.get                          = Permet obtenir el llistat d'inst\u00E0ncies relacionades amb una operaci\u00F3 estad\u00EDstica en concret
api.doc.swagger.paths.operations.operationId.instances.get.parameters.fields        = Permet personalitzar la resposta mitjan\u00E7ant l'exclusi\u00F3 o inclusi\u00F3 de camps d'aquesta. Els possibles valors s\u00F3n '+subjectArea' i '+diffusionAndPublicationVisible'.<br/>Exemples: <br/>\\r\\n- fields=+subjectArea,+diffusionAndPublicationVisible<br/>
api.doc.swagger.paths.operations.operationId.instances.get.parameters.query         = Permet realitzar una cerca sobre els resultats. <br/>\r\n Les metadades sobre els quals es pot buscar s\u00F3n:ID, URN, TITLE, ACRONYM, DATA_DESCRIPTION, GEOGRAPHIC_GRANULARITY_URN, TEMPORAL_GRANULARITY_URN, DIFFUSION_PUBLICATION_VISIBLE e INVENTORY_DATE.<br/>\r\n Els operadors l\u00F2gics que es permet usar s\u00F3n: AND i OR. <br/>\r\n Els operadors de comparaci\u00F3 que es permet usar s\u00F3n: EQ, IEQ, LIKE, ILIKE, NE, LT, LI, GT, GE, IS_NULL, IS_NOT_NULL i IN. <br/>\\r\\n Exemples: <br/>\\r\\n- ID LIKE \\"E303\\" <br/>\\r\\n- (ID LIKE \\"Instance1\\" AND DATA_DESCRIPTION EQ \\"DataDescription1\\") OR (ACRONYM EQ \\"Instance1\\")
api.doc.swagger.paths.operations.operationId.instances.id.get                       = Permet obtenir una inst\u00E0ncia en particular d'una operaci\u00F3 estad\u00EDstica
api.doc.swagger.paths.operations.operationId.instances.id.get.parameters.id         = Identificador de la inst\u00E0ncia
api.doc.swagger.paths.operationsIdParam.idDescription                               = Identificador de l'operaci\u00F3 estad\u00EDstica
api.doc.swagger.paths.operationsQueryParam.queryDescription                         = Permet realitzar una cerca sobre els resultats. <br/>\\r\\n Les metadades sobre els quals es pot buscar s\u00F3n:  ID, URN, TITLE, ACRONYM, SUBJECT_AREA_URN, SECONDARY_SUBJECT_AREA_URN, DESCRIPTION, STATISTICAL_OPERATION_TYPE_ID, OFFICIALITY_TYPE_ID, IS_INDICATORS_SYSTEM, PRODUCER_URN, CURRENTLY_ACTIVE, STATUS, PUBLISHER_URN e INVENTORY_DATE.<br/>\\r\\n Els operadors l\u00F2gics que es permet usar s\u00F3n: AND i OR. <br/>\\r\\n Els operadors de comparaci\u00F3 que es permet usar s\u00F3n: EQ, IEQ, LIKE, ILIKE, NE, LT, LI, GT, GE, IS_NULL, IS_NOT_NULL i IN. <br/>\\r\\n Exemples: <br/>\\r\\n- ID LIKE \\"E303\\" <br/>\\r\\n- (ID LIKE \\"E303\\" AND CONTACT_URN LIKE \\"urn:contact:1\\") OR (CONTACT_URN EQ \\"urn:contact:2\\")
api.doc.swagger.paths.responses.200                                                 = \u00C8xit. Indica que la petici\u00F3 ha estat resolta correctament
api.doc.swagger.paths.responses.406                                                 = No acceptable. El format sol\u00B7licitat no \u00E9s v\u00E0lid
api.doc.swagger.paths.responses.500                                                 = Error intern del servidor. S'ha produ\u00EFt un error que impedeix que s'obtingui el recurs sol\u00B7licitat
api.doc.swagger.paths.responses.503                                                 = Servei no disponible. Indica que actualment el servidor no est\u00E0 disponible i, per tant, la sol\u00B7licitud no pot processar-se. L'error pot deure's a una sobrec\u00E0rrega temporal o a labors de manteniment del servidor. Es tracta d'una situaci\u00F3 temporal
