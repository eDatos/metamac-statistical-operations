api.doc.swagger.paths.operationsQueryParam.queryDescription = Permet realitzar una cerca sobre els resultats. <br/>\r\n Les metadades sobre els quals es pot buscar són:  ID, URN, TITLE, ACRONYM, SUBJECT_AREA_URN, SECONDARY_SUBJECT_AREA_URN, DESCRIPTION, STATISTICAL_OPERATION_TYPE_ID, OFFICIALITY_TYPE_ID, IS_INDICATORS_SYSTEM, PRODUCER_URN, CURRENTLY_ACTIVE, STATUS, PUBLISHER_URN e INVENTORY_DATE.<br/>\r\n Els operadors lògics que es permet usar són: AND i OR. <br/>\r\n Els operadors de comparació que es permet usar són: EQ, IEQ, LIKE, ILIKE, NE, LT, LI, GT, GE, IS_NULL, IS_NOT_NULL i IN. <br/>\r\n Exemples: <br/>\r\n- ID LIKE \\"E303\\" <br/>\r\n- (ID LIKE \\"E303\\" AND CONTACT_URN LIKE \\"urn:contact:1\\") OR (CONTACT_URN EQ \\"urn:contact:2\\")
