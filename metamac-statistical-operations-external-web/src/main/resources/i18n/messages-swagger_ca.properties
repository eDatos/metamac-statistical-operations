api.doc.swagger.paths.families.get.parameters.query = Permet realitzar una cerca sobre els resultats. <br/>\r\n Les metadades sobre els quals es pot buscar són: ID, URN, TITLE, ACRONYM, DESCRIPTION e INVENTORY_DATE.<br/>\r\n Els operadors lògics que es permet usar són: AND i OR. <br/>\r\n Els operadors de comparació que es permet usar són: EQ, IEQ, LIKE, ILIKE, NE, LT, LI, GT, GE, IS_NULL, IS_NOT_NULL i IN. <br/>\r\n Exemples: <br/>\r\n- ID LIKE \\"E303\\" <br/>\r\n- (ID LIKE \\"Family1\\" AND ACRONYM EQ \\"Family1\\") OR (DESCRIPTION IS_NOT_NULL)
api.doc.swagger.definitions.instance.properties.dataDescription = Descriu, d'una manera fàcilment comprensible, les principals dades i indicadors difosos. Aquesta breu descripció ha de ser entesa immediatament i fàcilment pels usuaris
